<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="silverField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Silver Frame with Wing Flanges -->
  <polygon points="12,42 24,32 24,62 12,72" fill="url(#silverBevel)" filter="url(#badgeShadow)" />
