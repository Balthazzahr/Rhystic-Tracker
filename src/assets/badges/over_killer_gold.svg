<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="goldField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="60%" stop-color="#1E0B02" />
      <stop offset="100%" stop-color="#080200" />
    </radialGradient>
    <linearGradient id="graveStoneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Gold Frame with Laurels & Crown -->
  <g filter="url(#badgeShadow)">
    <polygon points="10,44 24,34 24,52 6,64" fill="url(#goldBevel)" />
    <polygon points="8,64 24,54 24,72 12,82" fill="url(#goldBevel)" />
    <polygon points="110,44 96,34 96,52 114,64" fill="url(#goldBevel)" />
    <polygon points="112,64 96,54 96,72 108,82" fill="url(#goldBevel)" />
  </g>
  <polygon points="44,108 60,119 76,108 60,104" fill="url(#goldBevel)" filter="url(#badgeShadow)" />

  <path d="M60 4 L102 20 C108 48 104 84 60 116 C16 84 12 48 18 20 Z" fill="url(#goldBevel)" filter="url(#badgeShadow)" />
  <path d="M60 9 L97 23 C102 48 98 79 60 108 C22 79 18 48 23 23 Z" fill="url(#goldRim)" />
  <path d="M60 13 L93 26 C97 48 94 76 60 103 C26 76 23 48 27 26 Z" fill="url(#goldInner)" />
  <path d="M60 16 L89 28 C93 48 90 72 60 98 C30 72 27 48 31 28 Z" fill="url(#goldField)" />

  <polygon points="60,0 66,8 54,8" fill="url(#goldBevel)" />
  <polygon points="60,2 61.5,6 66,7 62,8.5 60,12 58,8.5 54,7 58.5,6" fill="#FFFBEB" />
  <circle cx="24" cy="24" r="2" fill="#FFFBEB" stroke="#78350F" stroke-width="0.8" />
  <circle cx="96" cy="24" r="2" fill="#FFFBEB" stroke="#78350F" stroke-width="0.8" />

  <!-- Tombstone with XXXX, Dirt Mound & Grass -->
  <g transform="translate(60, 57)">
    <!-- Dirt mound base -->
    <ellipse cx="0" cy="14" rx="20" ry="5.5" fill="#1E0B02" opacity="0.9" />
    <ellipse cx="0" cy="13" rx="17" ry="4" fill="#3B1C0B" />
    
    <!-- Tombstone Shadow -->
    <path d="M -13 11 L -13 -8 C -13 -21, 15 -21, 15 -8 L 15 11 Z" fill="#080200" opacity="0.7" />

    <!-- Tombstone Body -->
    <path d="M -13 10 L -13 -9 C -13 -22, 13 -22, 13 -9 L 13 10 Z" fill="url(#graveStoneGold)" stroke="#FEF08A" stroke-width="0.8" />
    
    <!-- Stone Bevel Highlight -->
    <path d="M -11 9 L -11 -9 C -11 -19, 11 -19, 11 -9 L 11 9" fill="none" stroke="#FFFBEB" stroke-width="0.6" opacity="0.6" />
    
    <!-- Stone Crack -->
    <path d="M 5 -17 L 2 -12 L 6 -8" stroke="#334155" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7" />

    <!-- Engraved XXXX Text -->
    <text x="0" y="-2.5" font-family="monospace" font-weight="900" font-size="7.5" fill="#080200" text-anchor="middle" letter-spacing="1.2">XXXX</text>
    <text x="0" y="-2" font-family="monospace" font-weight="900" font-size="7.5" fill="#FEF08A" text-anchor="middle" letter-spacing="1.2" opacity="0.5">XXXX</text>

    <!-- Dirt overlay around base -->
    <path d="M -15 13 Q 0 8 15 13 Q 0 16 -15 13 Z" fill="#451A03" />
    <circle cx="-6" cy="12" r="1.2" fill="#78350F" />
    <circle cx="5" cy="13" r="1" fill="#78350F" />
    <circle cx="10" cy="12.5" r="0.8" fill="#78350F" />

    <!-- Grass Tufts -->
    <!-- Left tuft -->
    <path d="M -14 12 C -17 8 -18 4 -19 1 C -17 5 -15 9 -13 12 Z" fill="#22C55E" />
    <path d="M -12 13 C -14 8 -13 4 -12 2 C -12 7 -11 10 -10 13 Z" fill="#86EFAC" />
    <!-- Right tuft -->
    <path d="M 12 12 C 14 8 17 5 18 2 C 16 7 14 10 11 13 Z" fill="#22C55E" />
    <path d="M 10 13 C 11 9 13 5 14 3 C 12 8 11 10 9 13 Z" fill="#86EFAC" />
  </g>
</svg>