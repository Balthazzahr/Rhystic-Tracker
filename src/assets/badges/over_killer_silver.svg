<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="silverField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="graveStoneSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Silver Frame with Wing Flanges -->
  <polygon points="12,42 24,32 24,62 12,72" fill="url(#silverBevel)" filter="url(#badgeShadow)" />
  <polygon points="108,42 96,32 96,62 108,72" fill="url(#silverBevel)" filter="url(#badgeShadow)" />
  <circle cx="18" cy="52" r="1.8" fill="#FFFFFF" stroke="#475569" stroke-width="0.6" />
  <circle cx="102" cy="52" r="1.8" fill="#FFFFFF" stroke="#475569" stroke-width="0.6" />

  <path d="M60 4 L102 20 C108 48 104 84 60 116 C16 84 12 48 18 20 Z" fill="url(#silverBevel)" filter="url(#badgeShadow)" />
  <path d="M60 9 L97 23 C102 48 98 79 60 108 C22 79 18 48 23 23 Z" fill="url(#silverRim)" />
  <path d="M60 13 L93 26 C97 48 94 76 60 103 C26 76 23 48 27 26 Z" fill="url(#silverInner)" />
  <path d="M60 16 L89 28 C93 48 90 72 60 98 C30 72 27 48 31 28 Z" fill="url(#silverField)" />
  <circle cx="60" cy="13" r="2" fill="#FFFFFF" stroke="#475569" stroke-width="0.6" />

  <!-- Tombstone with XXXX, Dirt Mound & Grass -->
  <g transform="translate(60, 57)">
    <!-- Dirt mound base -->
    <ellipse cx="0" cy="14" rx="20" ry="5.5" fill="#0F172A" opacity="0.9" />
    <ellipse cx="0" cy="13" rx="17" ry="4" fill="#1E293B" />
    
    <!-- Tombstone Shadow -->
    <path d="M -13 11 L -13 -8 C -13 -21, 15 -21, 15 -8 L 15 11 Z" fill="#020617" opacity="0.7" />

    <!-- Tombstone Body -->
    <path d="M -13 10 L -13 -9 C -13 -22, 13 -22, 13 -9 L 13 10 Z" fill="url(#graveStoneSilver)" stroke="#FFFFFF" stroke-width="0.8" />
    
    <!-- Stone Bevel Highlight -->
    <path d="M -11 9 L -11 -9 C -11 -19, 11 -19, 11 -9 L 11 9" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.5" />
    
    <!-- Stone Crack -->
    <path d="M 5 -17 L 2 -12 L 6 -8" stroke="#1E293B" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7" />

    <!-- Engraved XXXX Text -->
    <text x="0" y="-2.5" font-family="monospace" font-weight="900" font-size="7.5" fill="#0F172A" text-anchor="middle" letter-spacing="1.2">XXXX</text>
    <text x="0" y="-2" font-family="monospace" font-weight="900" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2" opacity="0.4">XXXX</text>

    <!-- Dirt overlay around base -->
    <path d="M -15 13 Q 0 8 15 13 Q 0 16 -15 13 Z" fill="#334155" />
    <circle cx="-6" cy="12" r="1.2" fill="#475569" />
    <circle cx="5" cy="13" r="1" fill="#475569" />
    <circle cx="10" cy="12.5" r="0.8" fill="#475569" />

    <!-- Grass Tufts -->
    <!-- Left tuft -->
    <path d="M -14 12 C -17 8 -18 4 -19 1 C -17 5 -15 9 -13 12 Z" fill="#10B981" />
    <path d="M -12 13 C -14 8 -13 4 -12 2 C -12 7 -11 10 -10 13 Z" fill="#34D399" />
    <!-- Right tuft -->
    <path d="M 12 12 C 14 8 17 5 18 2 C 16 7 14 10 11 13 Z" fill="#10B981" />
    <path d="M 10 13 C 11 9 13 5 14 3 C 12 8 11 10 9 13 Z" fill="#34D399" />
  </g>
</svg>