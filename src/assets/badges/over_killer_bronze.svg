<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="25%" stop-color="#FB923C" />
      <stop offset="65%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="bronzeRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="bronzeInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="50%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="bronzeField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="60%" stop-color="#1F0702" />
      <stop offset="100%" stop-color="#080201" />
    </radialGradient>
    <linearGradient id="graveStoneBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Bronze Frame -->
  <path d="M60 4 L102 20 C108 48 104 84 60 116 C16 84 12 48 18 20 Z" fill="url(#bronzeBevel)" filter="url(#badgeShadow)" />
  <path d="M60 9 L97 23 C102 48 98 79 60 108 C22 79 18 48 23 23 Z" fill="url(#bronzeRim)" />
  <path d="M60 13 L93 26 C97 48 94 76 60 103 C26 76 23 48 27 26 Z" fill="url(#bronzeInner)" />
  <path d="M60 16 L89 28 C93 48 90 72 60 98 C30 72 27 48 31 28 Z" fill="url(#bronzeField)" />
  <circle cx="60" cy="13" r="2" fill="#FFEDD5" />

  <!-- Tombstone with XXXX, Dirt Mound & Grass -->
  <g transform="translate(60, 57)">
    <!-- Dirt mound base -->
    <ellipse cx="0" cy="14" rx="20" ry="5.5" fill="#1C1917" opacity="0.9" />
    <ellipse cx="0" cy="13" rx="17" ry="4" fill="#292524" />
    
    <!-- Tombstone Shadow -->
    <path d="M -13 11 L -13 -8 C -13 -21, 15 -21, 15 -8 L 15 11 Z" fill="#0F172A" opacity="0.6" />

    <!-- Tombstone Body -->
    <path d="M -13 10 L -13 -9 C -13 -22, 13 -22, 13 -9 L 13 10 Z" fill="url(#graveStoneBronze)" stroke="#CBD5E1" stroke-width="0.8" />
    
    <!-- Stone Bevel Highlight -->
    <path d="M -11 9 L -11 -9 C -11 -19, 11 -19, 11 -9 L 11 9" fill="none" stroke="#E2E8F0" stroke-width="0.6" opacity="0.4" />
    
    <!-- Stone Crack -->
    <path d="M 5 -17 L 2 -12 L 6 -8" stroke="#1E293B" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7" />

    <!-- Engraved XXXX Text -->
    <text x="0" y="-2.5" font-family="monospace" font-weight="900" font-size="7.5" fill="#0F172A" text-anchor="middle" letter-spacing="1.2">XXXX</text>
    <text x="0" y="-2" font-family="monospace" font-weight="900" font-size="7.5" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2" opacity="0.3">XXXX</text>

    <!-- Dirt overlay around base -->
    <path d="M -15 13 Q 0 8 15 13 Q 0 16 -15 13 Z" fill="#382014" />
    <circle cx="-6" cy="12" r="1.2" fill="#57301D" />
    <circle cx="5" cy="13" r="1" fill="#57301D" />
    <circle cx="10" cy="12.5" r="0.8" fill="#57301D" />

    <!-- Grass Tufts -->
    <!-- Left tuft -->
    <path d="M -14 12 C -17 8 -18 4 -19 1 C -17 5 -15 9 -13 12 Z" fill="#22C55E" />
    <path d="M -12 13 C -14 8 -13 4 -12 2 C -12 7 -11 10 -10 13 Z" fill="#4ADE80" />
    <!-- Right tuft -->
    <path d="M 12 12 C 14 8 17 5 18 2 C 16 7 14 10 11 13 Z" fill="#22C55E" />
    <path d="M 10 13 C 11 9 13 5 14 3 C 12 8 11 10 9 13 Z" fill="#4ADE80" />
  </g>
</svg>