        <g transform="translate(14, -10)"><circle cx="0" cy="0" r="4.2" fill="#0284C7" stroke="#FFFBEB" stroke-width="0.6" /><text x="0" y="1.6" font-family="'JetBrains Mono', monospace" font-size="4.2" font-weight="900" fill="#FFFFFF" text-anchor="middle">+1</text></g>
        <g transform="translate(-14, 8)"><circle cx="0" cy="0" r="4.5" fill="#0284C7" stroke="#FFFBEB" stroke-width="0.6" /><text x="0" y="1.8" font-family="'JetBrains Mono', monospace" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">+1</text></g>
        <g transform="translate(14, 8)"><circle cx="0" cy="0" r="4.5" fill="#0284C7" stroke="#FFFBEB" stroke-width="0.6" /><text x="0" y="1.8" font-family="'JetBrains Mono', monospace" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">+1</text></g>
      </g>
</svg>