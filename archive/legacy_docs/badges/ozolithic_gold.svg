        <polygon points="-8,-8 0,-8 0,2 -6,2" fill="rgba(255,255,255,0.3)" />
        <polygon points="-7,5 7,5 4,15 -4,15" fill="#D97706" stroke="#FFFBEB" stroke-width="0.8" />
