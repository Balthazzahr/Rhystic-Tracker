<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="goldField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="60%" stop-color="#1E0B02" />
      <stop offset="100%" stop-color="#080200" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Gold Frame with Laurels & Crown -->
  <g filter="url(#badgeShadow)">
    <polygon points="10,44 24,34 24,52 6,64" fill="url(#goldBevel)" />
    <polygon points="8,64 24,54 24,72 12,82" fill="url(#goldBevel)" />
    <polygon points="110,44 96,34 96,52 114,64" fill="url(#goldBevel)" />
