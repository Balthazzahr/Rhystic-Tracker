<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="100%" height="100%">
  <defs>
    <!-- Neutral Metallic Silver / Platinum Gradients (Matching Frame) -->
    <linearGradient id="neutralBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="neutralRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="neutralInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="neutralField" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Clean Dagger & Blood Shading -->
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="bloodRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Clean, Uncluttered Game Shield Badge (Matching Geometry) -->
  <!-- Outer Beveled Shield -->
  <path d="M60 6 L104 22 C110 50 106 88 60 122 C14 88 10 50 16 22 Z" fill="url(#neutralBevel)" filter="url(#badgeShadow)" />
  <!-- Mid Metal Ridge -->
  <path d="M60 11 L99 26 C104 51 100 83 60 114 C20 83 16 51 21 26 Z" fill="url(#neutralRim)" />
  <!-- Inner Border Frame -->
  <path d="M60 15 L95 29 C99 51 96 80 60 108 C24 80 21 51 25 29 Z" fill="url(#neutralInner)" />
  <!-- Dark Radial Inner Field -->
  <path d="M60 18 L91 31 C95 51 92 76 60 103 C28 76 25 51 29 31 Z" fill="url(#neutralField)" />

  <!-- Clean Top Stud -->
  <circle cx="60" cy="15" r="2.5" fill="#FFFFFF" />

  <!-- Central Visual Icon: Simple Dagger with Dripping Blood -->
  <g transform="translate(60, 60) rotate(45) translate(-60, -60)">
    <!-- Round Pommel -->
    <circle cx="60" cy="27" r="3.5" fill="#FFFFFF" stroke="#475569" stroke-width="0.8" />
    <!-- Straight Handle -->
    <rect x="58" y="30" width="4" height="12" rx="1" fill="#334155" stroke="#FFFFFF" stroke-width="0.6" />
    
    <!-- Crossguard -->
    <path d="M48 42 L72 42 L69 45 L51 45 Z" fill="#94A3B8" stroke="#FFFFFF" stroke-width="0.8" />
    
    <!-- Double-Edged Dagger Blade -->
    <polygon points="55,45 65,45 62,75 60,88 58,75" fill="url(#bladeSteel)" stroke="#FFFFFF" stroke-width="0.8" />
    <!-- Center Ridge -->
    <line x1="60" y1="45" x2="60" y2="85" stroke="#334155" stroke-width="0.8" />

    <!-- Blood Stained Tip -->
    <path d="M57 72 C59 76 61 76 63 72 L60 88 Z" fill="url(#bloodRed)" />
  </g>

  <!-- Dripping Blood Droplet Falling from Tip -->
  <path d="M42 85 C39 85 37 88 37 90.5 C37 93 39 95 42 95 C45 95 47 93 47 90.5 C47 88 45 85 42 85 Z" fill="url(#bloodRed)" />
  <!-- Small Secondary Droplet -->
  <circle cx="41.5" cy="101" r="2" fill="url(#bloodRed)" />
</svg>
