name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.1.5)'
        required: false
        default: ''

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build Linux Binary
        run: |
          npm run build
          npx @tauri-apps/cli build --no-bundle --features production-env

      - name: Package Linux Artifact
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/rhystic-tracker dist-release/rhystic-tracker
          tar -czvf rhystic-tracker-linux-x86_64.tar.gz -C dist-release rhystic-tracker

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: rhystic-tracker-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node dependencies
        run: npm ci

      - name: Build macOS Bundle
        run: |
          npx @tauri-apps/cli build --target universal-apple-darwin --features production-env

      - name: Package macOS Artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-release/rhystic-tracker-macos-universal.dmg
          tar -czvf dist-release/rhystic-tracker-macos-universal-app.tar.gz -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "Rhystic Tracker.app"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-release/rhystic-tracker-macos-universal.dmg

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist-release/rhystic-tracker-macos-universal-app.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Download macOS App Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app

      - name: Generate Checksums
        run: |
          sha256sum rhystic-tracker-linux-x86_64.tar.gz rhystic-tracker-macos-universal.dmg rhystic-tracker-macos-universal-app.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rhystic-tracker-linux-x86_64.tar.gz
            rhystic-tracker-macos-universal.dmg
            rhystic-tracker-macos-universal-app.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          make_latest: "true"

      - name: Publish to Arch User Repository (AUR)
        if: env.AUR_KEY != ''
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        uses: KSXGitHub/github-actions-deploy-aur@v4
        with:
          pkgname: rhystic-tracker-bin
          pkgbuild: ./packaging/aur/rhystic-tracker-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Release ${{ github.ref_name }}"

